[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-to-image-prompt-enhancer"
version = "0.2.0"
description = "LLM-driven prompt enhancement for text-to-image and video models: bundled presets, pluggable providers (ollama, OpenAI-compatible, Anthropic), library API and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wujidadi" }]
keywords = ["prompt", "text-to-image", "llm", "ollama", "stable-diffusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Wujidadi/text-to-image-prompt-enhancer"

[project.scripts]
prompt-enhancer = "prompt_enhancer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_enhancer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
